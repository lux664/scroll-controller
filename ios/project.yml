# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   cd ios && xcodegen generate
name: ScrollController
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  ScrollController:
    type: application
    platform: iOS
    sources:
      - path: ScrollController
      # The ONE shared script, bundled as a resource (not copied into ios/).
      - path: ../shared/reels-blocker.js
        buildPhase: resources
        group: Shared
    settings:
      base:
        # io.github.<github-username>.scrollcontroller
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lux664.scrollcontroller
        PRODUCT_NAME: ScrollController
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scroll Controller
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Shown only if you pick "Take Photo" / "Photo Library" while posting.
        INFOPLIST_KEY_NSCameraUsageDescription: Lets you take a photo or video to post on Instagram.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Lets you record video with sound to post on Instagram.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Lets you choose photos and videos to post on Instagram.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Free Apple ID friendly: automatic signing, no special capabilities.
        # Pick your own team in Xcode (Signing & Capabilities) before running on a phone.
        CODE_SIGN_STYLE: Automatic
